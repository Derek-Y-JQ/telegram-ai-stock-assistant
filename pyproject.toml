[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-stock-bot"
version = "2.0.0"
description = "Modern AI-powered A-share stock assistant for Telegram with Tool-Calling Agent, mplfinance K-line charts, and quantitative technical diagnosis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.6",
    "openai>=1.55.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "akshare>=1.14.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "mplfinance>=0.12.10b0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
tushare = [
    "tushare>=1.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
stock-bot = "stock_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
